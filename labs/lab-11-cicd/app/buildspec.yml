version: 0.2

env:
  variables:
    SERVICE_NAME: "enrolment"
    ARTIFACT_DIR: "dist"
    IMAGE_REPO_URI: "nginx"

phases:

  install:
    commands:
      - echo "--- install ---"
      - python3 --version
      - docker --version || echo "no docker client in this build image"

  pre_build:
    commands:
      - echo "--- pre_build ---"
      - test -f VERSION || { echo "VERSION file is missing"; exit 1; }
      - python3 -m json.tool config/service.json > /dev/null
      - |
        python3 -c '
        import json, sys
        want = "enrolment-api"
        got = json.load(open("config/service.json")).get("container")
        if got != want:
            sys.exit("CONTAINER CHECK FAILED: config/service.json names container %r but the task definition expects %r" % (got, want))
        '
      - |
        grep -q '"port": 80,' config/service.json || {
          echo "PORT CHECK FAILED: config/service.json must say \"port\": 80 - the ALB target group and the task definition both send traffic to port 80. Fix the port in config/service.json, then re-upload the source."
          exit 1
        }
      - echo "configuration validated"
      - USMS_RELEASE="$(tr -d '[:space:]' < VERSION)"
      - echo "release is $USMS_RELEASE"
      - |
        if docker info >/dev/null 2>&1; then
          echo "docker daemon reachable - this build will build and push an image"
          aws ecr get-login-password --region "${AWS_REGION_COURSE:-us-east-1}" \
            | docker login --username AWS --password-stdin "${IMAGE_REPO_URI%%/*}" \
            || echo "docker login failed - continuing; the image must already exist"
        else
          echo "no docker daemon in this build container - skipping the image build"
          echo "the image must already exist at ${IMAGE_REPO_URI} with this release tag"
        fi

  build:
    commands:
      - echo "--- build ---"
      - USMS_RELEASE="$(tr -d '[:space:]' < VERSION)"
      - BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - echo "release=$USMS_RELEASE builtAt=$BUILT_AT"
      - IMAGE_TAG="$USMS_RELEASE-${CODEBUILD_BUILD_NUMBER:-local-$(date -u +%Y%m%d%H%M%S)}"
      - echo "image tag (unique per build, safe for IMMUTABLE tags): $IMAGE_TAG"
      - rm -rf "$ARTIFACT_DIR"
      - mkdir -p "$ARTIFACT_DIR"
      - cp -R src/. "$ARTIFACT_DIR"/
      - sed -i.bak -e "s|__RELEASE__|$USMS_RELEASE|g" -e "s|__BUILT_AT__|$BUILT_AT|g" "$ARTIFACT_DIR/index.html"
      - rm -f "$ARTIFACT_DIR/index.html.bak"
      - |
        cat > "$ARTIFACT_DIR/build-metadata.json" << META
        {
          "service": "$SERVICE_NAME",
          "release": "$USMS_RELEASE",
          "builtAt": "$BUILT_AT",
          "buildId": "${CODEBUILD_BUILD_ID:-local}",
          "sourceVersion": "${CODEBUILD_RESOLVED_SOURCE_VERSION:-local}",
          "imageUri": "${IMAGE_REPO_URI}:$IMAGE_TAG"
        }
        META
      - cp config/service.json "$ARTIFACT_DIR/service.json"
      - |
        if docker info >/dev/null 2>&1; then
          docker build -t "${IMAGE_REPO_URI}:$IMAGE_TAG" .
          docker push "${IMAGE_REPO_URI}:$IMAGE_TAG" \
            || echo "push failed - see Section 10; the deploy stage will use the existing tag"
        fi
      - |
        IMAGE_URI="${IMAGE_REPO_URI}:$IMAGE_TAG" python3 - > "$ARTIFACT_DIR/imagedefinitions.json" << 'IMGDEF'
        import json, os
        cfg = json.load(open("config/service.json"))
        print(json.dumps([{"name": cfg["container"],
                           "imageUri": os.environ["IMAGE_URI"]}], indent=2))
        IMGDEF

  post_build:
    commands:
      - echo "--- post_build ---"
      - |
        TEST_STATUS=0
        bash tests/smoke.sh || TEST_STATUS=$?
        echo "$TEST_STATUS" > "${TMPDIR:-/tmp}/usms-smoke-status"
        test "$TEST_STATUS" -eq 0
      - cat "$ARTIFACT_DIR/imagedefinitions.json"
      - ls -l "$ARTIFACT_DIR"
    finally:
      - |
        mkdir -p "$ARTIFACT_DIR"
        echo "release=$(tr -d '[:space:]' < VERSION) tests_exit=$(cat "${TMPDIR:-/tmp}/usms-smoke-status" 2>/dev/null || echo not-run) at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$ARTIFACT_DIR/build-summary.txt"
        cat "$ARTIFACT_DIR/build-summary.txt"

artifacts:
  base-directory: dist
  files:
    - '**/*'

cache:
  paths: []
